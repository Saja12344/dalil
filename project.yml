name: Nazlah
options:
  bundleIdPrefix: sa.nazlah
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultLocalization: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_CFBundleDisplayName: دليل
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: حواليك يستخدم موقعك مرة واحدة لعرض المحطات والأماكن القريبة منك. لا نتتبّع تنقّلك المستمر.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: حواليك يحتاج الوصول للصور فقط عندما تضيف صور مكان من جهازك.
    INFOPLIST_KEY_NSCameraUsageDescription: حواليك يستخدم الكاميرا فقط عندما تلتقط صورة لمكان تضيفه.
    INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: sa.nazlah.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_EMIT_LOC_STRINGS: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    DEVELOPMENT_LANGUAGE: ar
configs:
  Debug: debug
  Release: release
targets:
  Nazlah:
    type: application
    platform: iOS
    sources:
      - path: Nazlah
        excludes:
          - "Resources/GoogleService-Info.plist.example"
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        GENERATE_INFOPLIST_FILE: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: SunsetOrange
        PRODUCT_BUNDLE_IDENTIFIER: sa.nazlah.app
    info:
      path: Nazlah/Info.plist
      properties:
        CFBundleDisplayName: دليل
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: حواليك يستخدم موقعك مرة واحدة لعرض المحطات والأماكن القريبة منك. لا نتتبّع تنقّلك المستمر.
        NSPhotoLibraryUsageDescription: حواليك يحتاج الوصول للصور فقط عندما تضيف صور مكان من جهازك.
        NSCameraUsageDescription: حواليك يستخدم الكاميرا فقط عندما تلتقط صورة لمكان تضيفه.
        UIAppFonts:
          - Changa-Variable.ttf
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
    scheme:
      testTargets:
        - NazlahTests
        - NazlahUITests
  NazlahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NazlahTests
    dependencies:
      - target: Nazlah
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sa.nazlah.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nazlah.app/Nazlah"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  NazlahUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NazlahUITests
    dependencies:
      - target: Nazlah
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: sa.nazlah.app.uitests
        TEST_TARGET_NAME: Nazlah
schemes:
  Nazlah:
    build:
      targets:
        Nazlah: all
        NazlahTests: [test]
        NazlahUITests: [test]
    test:
      targets:
        - NazlahTests
        - NazlahUITests
      gatherCoverageData: true
      coverageTargets:
        - Nazlah
    run:
      config: Debug
      commandLineArguments:
        "-AppleLanguages":
          enabled: false
          value: "(ar)"
